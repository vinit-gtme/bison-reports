name: Bison Bounce Rate Report

on:
  schedule:
    - cron: "0 1 * * SAT"   # 01:00 UTC Saturday = 8:00 PM EST (winter, UTC-5)
    - cron: "0 0 * * SAT"   # 00:00 UTC Saturday = 8:00 PM EDT (summer, UTC-4)
  workflow_dispatch: {}      # click "Run workflow" in the Actions tab to test any time

jobs:
  bounce-report:
    runs-on: ubuntu-latest
    steps:
      - name: Guard — scheduled runs only fire at Friday 8PM ET; manual runs always proceed
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'EOF'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          event_name = os.environ.get("EVENT_NAME", "")
          if event_name == "workflow_dispatch":
              should_run = True
          else:
              now = datetime.now(ZoneInfo("America/New_York"))
              should_run = (now.weekday() == 4 and now.hour == 20)  # Friday == 4, 20 == 8PM

          print(f"event: {event_name}, should_run: {should_run}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={'true' if should_run else 'false'}\n")
          EOF

      - name: Checkout repo
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Run bounce rate report
        if: steps.guard.outputs.run == 'true'
        env:
          BISON_BASE_URL: ${{ secrets.BISON_BASE_URL }}
          BISON_API_TOKEN: ${{ secrets.BISON_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}
          # Leave REPORT_START_DATE / REPORT_END_DATE unset to use the rolling
          # Saturday-Friday week ending on the run date. Set both to override
          # with a fixed range for a one-off report.
        run: python bounce_report.py

      - name: Upload CSV reports
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bounce-rate-reports-${{ github.run_id }}
          path: |
            bounce_rate_by_mailbox.csv
            bounce_rate_by_domain.csv
            bounce_failed_mailboxes.csv
          if-no-files-found: ignore
