name: Bison Reply Rate Report

on:
  schedule:
    - cron: "0 1 * * SAT"   # 01:00 UTC Saturday = 8:00 PM EST (winter, UTC-5)
    - cron: "0 0 * * SAT"   # 00:00 UTC Saturday = 8:00 PM EDT (summer, UTC-4)
  workflow_dispatch: {}      # click "Run workflow" in the Actions tab to test any time

jobs:
  reply-rate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Guard — scheduled runs only fire at Friday 8PM ET; manual runs always proceed
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'EOF'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          event_name = os.environ.get("EVENT_NAME", "")
          if event_name == "workflow_dispatch":
              should_run = True
          else:
              now = datetime.now(ZoneInfo("America/New_York"))
              # Allow up to 20 minutes of scheduling delay around 8:00 PM,
              # narrower than the 60-minute gap between the two DST cron
              # entries above, so only the correct-season trigger ever passes.
              target_minutes = 20 * 60
              current_minutes = now.hour * 60 + now.minute
              should_run = (now.weekday() == 4 and abs(current_minutes - target_minutes) <= 20)

          print(f"event: {event_name}, should_run: {should_run}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={'true' if should_run else 'false'}\n")
          EOF

      - name: Checkout repo
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Debug — check Supabase secrets are visible
        if: steps.guard.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "SUPABASE_URL: EMPTY/UNSET"; else echo "SUPABASE_URL: set, length ${#SUPABASE_URL}"; fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "SUPABASE_SERVICE_ROLE_KEY: EMPTY/UNSET"; else echo "SUPABASE_SERVICE_ROLE_KEY: set, length ${#SUPABASE_SERVICE_ROLE_KEY}"; fi

      - name: Run reply rate report
        if: steps.guard.outputs.run == 'true'
        env:
          BISON_BASE_URL: ${{ secrets.BISON_BASE_URL }}
          BISON_API_TOKEN: ${{ secrets.BISON_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Leave REPORT_START_DATE / REPORT_END_DATE unset to use the rolling
          # Saturday-Friday week ending on the run date. Set both to override
          # with a fixed range for a one-off report.
        run: python reply_rate_report.py

      - name: Upload CSV reports
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reply-rate-reports-${{ github.run_id }}
          path: |
            reply_rate_by_mailbox.csv
            reply_rate_by_domain.csv
            reply_failed_mailboxes.csv
          if-no-files-found: ignore
