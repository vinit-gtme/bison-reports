<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outbound Email Health</title>
<style>
  :root{
    --bg:#0d1117;
    --panel:#141b23;
    --line:#232c37;
    --ink:#e6edf3;
    --ink-dim:#7d8a99;
    --good:#2fbf71;
    --warn:#e8a33d;
    --bad:#e0483e;
    --mono: "JetBrains Mono","SF Mono",Consolas,monospace;
    --sans: "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--sans); padding:32px 20px 60px;
  }
  .wrap{max-width:960px;margin:0 auto;}
  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:8px;}
  h1{font-size:1.15rem;font-weight:600;letter-spacing:.01em;margin:0;}
  .updated{font-family:var(--mono);font-size:.75rem;color:var(--ink-dim);}

  .lights{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  @media(max-width:560px){.lights{grid-template-columns:1fr;}}
  .light{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:20px 22px; position:relative; overflow:hidden;
  }
  .light::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
    background:var(--dot,var(--ink-dim));
  }
  .light .label{font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-dim);}
  .light .value{font-family:var(--mono); font-size:2.4rem; font-weight:600; margin-top:6px; display:flex; align-items:baseline; gap:10px;}
  .light .value .unit{font-size:1.1rem; color:var(--ink-dim); font-weight:400;}
  .light .sub{font-size:.78rem; color:var(--ink-dim); margin-top:4px;}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--dot,var(--ink-dim));display:inline-block;}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:22px; margin-bottom:16px;}
  .panel h2{font-size:.78rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-dim); margin:0 0 16px;}
  #trend{width:100%; height:220px; display:block;}

  table{width:100%; border-collapse:collapse; font-size:.88rem;}
  th,td{text-align:left; padding:9px 6px; border-bottom:1px solid var(--line);}
  th{color:var(--ink-dim); font-weight:500; font-size:.72rem; text-transform:uppercase; letter-spacing:.06em;}
  td.num,th.num{text-align:right; font-family:var(--mono);}
  tr:last-child td{border-bottom:none;}
  .pill{display:inline-block; padding:2px 8px; border-radius:20px; font-family:var(--mono); font-size:.78rem;}
  .empty{color:var(--ink-dim); font-size:.85rem; padding:20px 0; text-align:center;}

  .setup{background:var(--panel); border:1px dashed var(--line); border-radius:10px; padding:20px 22px; font-size:.85rem; color:var(--ink-dim); line-height:1.6;}
  .setup code{color:var(--ink); background:#1c2530; padding:1px 6px; border-radius:4px; font-family:var(--mono); font-size:.82rem;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Outbound Email Health</h1>
    <div class="updated" id="updated">loading…</div>
  </header>

  <div id="setup-notice"></div>

  <div class="lights">
    <div class="light" id="bounce-light">
      <div class="label">Bounce Rate · This Week</div>
      <div class="value"><span id="bounce-value">–</span><span class="unit">%</span></div>
      <div class="sub" id="bounce-sub">&nbsp;</div>
    </div>
    <div class="light" id="reply-light">
      <div class="label">Reply Rate · This Week</div>
      <div class="value"><span id="reply-value">–</span><span class="unit">%</span></div>
      <div class="sub" id="reply-sub">&nbsp;</div>
    </div>
  </div>

  <div class="panel">
    <h2>Trend — Company-Wide, By Week</h2>
    <svg id="trend" viewBox="0 0 900 220" preserveAspectRatio="none"></svg>
  </div>

  <div class="panel">
    <h2>Needs Attention — Domains Above 2% Bounce (This Week)</h2>
    <table id="attention-table">
      <thead><tr><th>Domain</th><th class="num">Sent</th><th class="num">Bounced</th><th class="num">Bounce Rate</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="empty" id="attention-empty" style="display:none;">No domains above threshold this week.</div>
  </div>
</div>

<script>
// ---- Fill these in once, then never touch again ----
const SUPABASE_URL = "https://tuccoyvmlfhqpapbbjta.supabase.co";   // e.g. https://tuccoyvmlfhqpapbbjta.supabase.co
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1Y2NveXZtbGZocXBhcGJianRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MDI1OTcsImV4cCI6MjEwMTk3ODU5N30.vEE3ec977LVhOrD8559afwGtyU_QP1Hm91K5vbcQo_g"; // Project Settings -> API -> anon/public key (NOT service_role)
// -----------------------------------------------------

const BOUNCE_THRESHOLD = 2.0;
const REPLY_THRESHOLD = 10.0;

async function sb(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
    },
  });
  if (!res.ok) throw new Error(`Supabase error ${res.status}: ${await res.text()}`);
  return res.json();
}

function statusColor(value, threshold, goodDirection) {
  const ok = goodDirection === "low" ? value <= threshold : value >= threshold;
  return ok ? "var(--good)" : (Math.abs(value - threshold) < threshold * 0.25 ? "var(--warn)" : "var(--bad)");
}

function drawTrend(rows) {
  const svg = document.getElementById("trend");
  svg.innerHTML = "";
  if (!rows.length) {
    svg.innerHTML = `<text x="450" y="110" fill="var(--ink-dim)" font-size="14" text-anchor="middle">No data yet</text>`;
    return;
  }
  const W = 900, H = 220, padL = 40, padR = 20, padT = 10, padB = 30;
  const maxVal = Math.max(10, ...rows.map(r => Math.max(r.bounce_rate, r.reply_rate))) * 1.15;
  const x = i => padL + (i / Math.max(1, rows.length - 1)) * (W - padL - padR);
  const y = v => H - padB - (v / maxVal) * (H - padT - padB);

  const line = (key, color) => {
    const pts = rows.map((r, i) => `${x(i)},${y(r[key])}`).join(" ");
    const path = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
    path.setAttribute("points", pts);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", color);
    path.setAttribute("stroke-width", "2");
    svg.appendChild(path);
    rows.forEach((r, i) => {
      const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      c.setAttribute("cx", x(i)); c.setAttribute("cy", y(r[key])); c.setAttribute("r", "3");
      c.setAttribute("fill", color);
      svg.appendChild(c);
    });
  };

  // gridline
  const axis = document.createElementNS("http://www.w3.org/2000/svg", "line");
  axis.setAttribute("x1", padL); axis.setAttribute("x2", W - padR);
  axis.setAttribute("y1", H - padB); axis.setAttribute("y2", H - padB);
  axis.setAttribute("stroke", "#232c37");
  svg.appendChild(axis);

  line("bounce_rate", "var(--bad)");
  line("reply_rate", "var(--good)");

  // labels for first/last week
  const label = (i, text) => {
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("x", x(i)); t.setAttribute("y", H - 8);
    t.setAttribute("fill", "var(--ink-dim)"); t.setAttribute("font-size", "11");
    t.setAttribute("text-anchor", i === 0 ? "start" : "end");
    t.textContent = text;
    svg.appendChild(t);
  };
  label(0, rows[0].week_start);
  if (rows.length > 1) label(rows.length - 1, rows[rows.length - 1].week_start);
}

async function main() {
  if (SUPABASE_URL.startsWith("YOUR_") || SUPABASE_ANON_KEY.startsWith("YOUR_")) {
    document.getElementById("setup-notice").innerHTML = `
      <div class="setup">
        Not connected yet. Open <code>docs/index.html</code> and set <code>SUPABASE_URL</code> and
        <code>SUPABASE_ANON_KEY</code> at the top of the script block (the anon/public key from
        Project Settings → API — never the service_role key). Also make sure a read-only
        RLS policy allows <code>SELECT</code> on <code>domain_weekly_stats</code> for the anon role.
      </div>`;
    document.getElementById("updated").textContent = "not connected";
    return;
  }

  try {
    const all = await sb("domain_weekly_stats?select=week_start,domain,sent,bounced,replied,bounce_rate,reply_rate&order=week_start.asc");
    if (!all.length) {
      document.getElementById("updated").textContent = "no data yet";
      return;
    }
    const latestWeek = all[all.length - 1].week_start;
    document.getElementById("updated").textContent = `latest week: ${latestWeek}`;

    // company-wide overall this week
    const thisWeek = all.filter(r => r.week_start === latestWeek);
    const totalSent = thisWeek.reduce((s, r) => s + r.sent, 0);
    const totalBounced = thisWeek.reduce((s, r) => s + r.bounced, 0);
    const totalReplied = thisWeek.reduce((s, r) => s + r.replied, 0);
    const overallBounce = totalSent ? +(totalBounced / totalSent * 100).toFixed(2) : 0;
    const overallReply = totalSent ? +(totalReplied / totalSent * 100).toFixed(2) : 0;

    document.getElementById("bounce-value").textContent = overallBounce;
    document.getElementById("reply-value").textContent = overallReply;
    document.getElementById("bounce-sub").textContent = `${totalBounced.toLocaleString()} of ${totalSent.toLocaleString()} sent`;
    document.getElementById("reply-sub").textContent = `${totalReplied.toLocaleString()} of ${totalSent.toLocaleString()} sent`;

    const bounceColor = statusColor(overallBounce, BOUNCE_THRESHOLD, "low");
    const replyColor = statusColor(overallReply, REPLY_THRESHOLD, "high");
    document.getElementById("bounce-light").style.setProperty("--dot", bounceColor);
    document.getElementById("reply-light").style.setProperty("--dot", replyColor);

    // trend: aggregate by week across all domains
    const byWeek = {};
    all.forEach(r => {
      byWeek[r.week_start] ??= { week_start: r.week_start, sent: 0, bounced: 0, replied: 0 };
      byWeek[r.week_start].sent += r.sent;
      byWeek[r.week_start].bounced += r.bounced;
      byWeek[r.week_start].replied += r.replied;
    });
    const trendRows = Object.values(byWeek).sort((a, b) => a.week_start.localeCompare(b.week_start)).map(w => ({
      week_start: w.week_start,
      bounce_rate: w.sent ? +(w.bounced / w.sent * 100).toFixed(2) : 0,
      reply_rate: w.sent ? +(w.replied / w.sent * 100).toFixed(2) : 0,
    }));
    drawTrend(trendRows);

    // attention list
    const attn = thisWeek.filter(r => r.bounce_rate > BOUNCE_THRESHOLD).sort((a, b) => b.bounce_rate - a.bounce_rate).slice(0, 10);
    const tbody = document.querySelector("#attention-table tbody");
    tbody.innerHTML = "";
    if (!attn.length) {
      document.getElementById("attention-empty").style.display = "block";
    } else {
      attn.forEach(r => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${r.domain}</td><td class="num">${r.sent.toLocaleString()}</td><td class="num">${r.bounced.toLocaleString()}</td><td class="num" style="color:var(--bad)">${r.bounce_rate}%</td>`;
        tbody.appendChild(tr);
      });
    }
  } catch (e) {
    document.getElementById("updated").textContent = "error loading data";
    console.error(e);
  }
}

main();
</script>
</body>
</html>
